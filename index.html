<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEO189 - Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
body { background: #0d0d0d; color: #fff; min-height: 100vh; }
header { background: #111; padding: 15px; border-bottom: 2px solid #d4af37; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
header h1 { color: #d4af37; font-size: 18px; letter-spacing: 2px; }
.header-btn { background: #1a1a1a; border: 1px solid #444; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; }
.header-btn:hover { border-color: #d4af37; color: #d4af37; }

.tabs { display: flex; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; overflow-x: auto; }
.tab { flex: 1; min-width: 100px; padding: 15px 10px; text-align: center; cursor: pointer; color: #888; font-weight: bold; font-size: 12px; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab.active { color: #d4af37; border-bottom-color: #d4af37; background: #1f1f1f; }
.tab .badge { background: #f44336; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: 5px; }

.sub-tabs { display: flex; gap: 8px; padding: 12px 15px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; }
.sub-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; background: #222; color: #888; font-weight: bold; font-size: 12px; border-radius: 8px; border: 1px solid #2a2a2a; }
.sub-tab.active { background: linear-gradient(90deg, #d4af37, #f5d76e); color: #000; border-color: #b8960c; }
.sub-tab .badge { background: #f44336; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 10px; }
.sub-tab.active .badge { background: #000; color: #fff; }

.content { padding: 15px; }
.tab-content { display: none; }
.tab-content.active { display: block; }

.search-box { margin-bottom: 15px; position: relative; }
.search-box input { width: 100%; padding: 12px 15px 12px 42px; border: 1px solid #2a2a2a; background: #1a1a1a; color: #fff; border-radius: 8px; font-size: 14px; outline: none; }
.search-box input:focus { border-color: #d4af37; }
.search-box svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: #888; }

.user-list { max-height: calc(100vh - 300px); overflow-y: auto; }
.user-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 15px; margin-bottom: 10px; cursor: pointer; }
.user-card:hover { border-color: #d4af37; }
.user-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.user-card-name { display: flex; align-items: center; gap: 10px; }
.user-card-avatar { width: 40px; height: 40px; background: linear-gradient(135deg, #d4af37, #f5d76e); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; font-size: 16px; }
.user-card-name h3 { font-size: 15px; color: #fff; }
.user-card-name p { font-size: 11px; color: #888; margin-top: 2px; }
.user-card-rank { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: #2a2a2a; color: #d4af37; font-weight: bold; }
.user-card-saldo { font-size: 14px; color: #4caf50; font-weight: bold; }
.user-card-detail { font-size: 11px; color: #888; margin-top: 5px; padding-top: 8px; border-top: 1px solid #2a2a2a; }

.user-detail-page { display: none; padding: 15px; }
.user-detail-page.active { display: block; }
.detail-page-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #d4af37; }
.back-btn { background: #1a1a1a; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; }
.back-btn svg { width: 20px; height: 20px; fill: currentColor; }
.detail-page-header h2 { color: #d4af37; font-size: 18px; }
.detail-page-header p { color: #888; font-size: 12px; margin-top: 3px; }
.detail-avatar-big { width: 80px; height: 80px; background: linear-gradient(135deg, #d4af37, #f5d76e); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; font-size: 32px; margin: 0 auto 15px; }
.section-title { color: #d4af37; font-size: 13px; font-weight: bold; text-transform: uppercase; margin: 20px 0 10px; padding-bottom: 8px; border-bottom: 1px solid #2a2a2a; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; font-weight: 600; }
.form-group input, .form-group select { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
.form-group input:disabled { background: #0d0d0d; color: #888; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
.stat-box { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px; text-align: center; }
.stat-box .label { font-size: 10px; color: #888; text-transform: uppercase; }
.stat-box .value { font-size: 15px; font-weight: bold; margin-top: 5px; }
.stat-box .value.green { color: #4caf50; }
.stat-box .value.gold { color: #d4af37; }
.save-btn { width: 100%; padding: 15px; background: linear-gradient(90deg, #d4af37, #f5d76e, #d4af37); border: none; border-radius: 8px; font-size: 15px; font-weight: bold; color: #000; cursor: pointer; margin-top: 15px; }
.danger-btn { width: 100%; padding: 15px; background: #f44336; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; color: #fff; cursor: pointer; margin-top: 10px; }

.inbox-item { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #d4af37; }
.inbox-item.withdraw { border-left-color: #ff9800; }
.inbox-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.inbox-user { font-size: 14px; font-weight: bold; color: #fff; }
.inbox-type { font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
.inbox-type.deposit { background: #4caf50; color: #fff; }
.inbox-type.withdraw { background: #ff9800; color: #fff; }
.inbox-actions { display: flex; gap: 10px; margin-top: 12px; }
.inbox-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; color: #fff; }
.inbox-btn.setujui { background: #4caf50; }
.inbox-btn.tolak { background: #f44336; }

.deposit-user-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-left: 4px solid #4caf50; border-radius: 10px; padding: 15px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.deposit-user-card:hover { border-color: #d4af37; }
.deposit-user-info { display: flex; align-items: center; gap: 12px; }
.deposit-user-avatar { width: 45px; height: 45px; background: linear-gradient(135deg, #4caf50, #8bc34a); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; font-size: 18px; }
.deposit-user-info h3 { font-size: 14px; color: #fff; }
.deposit-user-info p { font-size: 11px; color: #888; margin-top: 3px; }
.deposit-user-nominal { text-align: right; }
.deposit-user-nominal .nom { font-size: 16px; color: #4caf50; font-weight: bold; }
.deposit-user-nominal .time { font-size: 10px; color: #666; margin-top: 3px; }

.withdraw-detail { background: #0d0d0d; border: 1px solid #2a2a2a; border-radius: 8px; padding: 15px; margin-bottom: 12px; }
.withdraw-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #2a2a2a; font-size: 13px; }
.withdraw-row:last-child { border-bottom: none; }
.withdraw-row .label { color: #888; }
.withdraw-row .value { color: #fff; font-weight: bold; text-align: right; }
.withdraw-warning { background: #ff9800; color: #000; padding: 12px; border-radius: 8px; font-size: 11px; font-weight: bold; line-height: 1.5; margin-top: 12px; text-align: center; }

.bukti-thumb { width: 100%; max-width: 200px; border-radius: 8px; margin-top: 8px; border: 2px solid #d4af37; cursor: pointer; }
.fs-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; padding: 15px; cursor: zoom-out; }
.fs-overlay.active { display: flex; }
.fs-overlay img { max-width: 100%; max-height: 100%; border-radius: 8px; border: 2px solid #d4af37; }

.empty-inbox { text-align: center; padding: 50px 20px; color: #666; }

.chat-list { display: flex; flex-direction: column; gap: 10px; }
.chat-user-item { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 15px; cursor: pointer; display: flex; align-items: center; gap: 12px; }
.chat-user-item:hover { border-color: #d4af37; }
.chat-user-avatar { width: 45px; height: 45px; background: linear-gradient(135deg, #d4af37, #f5d76e); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; font-size: 18px; }
.chat-user-info { flex: 1; }
.chat-user-info h3 { font-size: 14px; color: #fff; }
.chat-user-info p { font-size: 11px; color: #888; margin-top: 3px; }
.chat-user-unread { background: #f44336; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 10px; font-weight: bold; }

.chat-window { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0d0d0d; z-index: 1500; flex-direction: column; }
.chat-window.active { display: flex; }
.chat-window-header { background: #111; padding: 12px 15px; display: flex; align-items: center; gap: 12px; border-bottom: 2px solid #d4af37; }
.chat-back-btn { background: none; border: none; color: #fff; cursor: pointer; padding: 5px; font-size: 24px; }
.chat-window-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
.chat-msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 13px; }
.chat-msg.user { align-self: flex-start; background: #2a2a2a; color: #fff; }
.chat-msg.admin { align-self: flex-end; background: linear-gradient(135deg, #d4af37, #f5d76e); color: #000; }
.chat-msg .time { font-size: 10px; opacity: 0.7; margin-top: 4px; display: block; }
.chat-window-input { padding: 12px; background: #111; display: flex; gap: 8px; border-top: 1px solid #2a2a2a; }
.chat-window-input input { flex: 1; padding: 12px; background: #2a2a2a; border: 1px solid #444; border-radius: 20px; color: #fff; outline: none; }
.chat-window-input button { background: linear-gradient(135deg, #d4af37, #f5d76e); border: none; padding: 12px 18px; border-radius: 20px; cursor: pointer; color: #000; font-weight: bold; }

.loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; gap: 20px; }
.loading-spinner { width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid #d4af37; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

.neo-notif { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #1a1a1a; color: #fff; padding: 14px 22px; border-radius: 10px; font-size: 14px; z-index: 9999; border: 2px solid #d4af37; max-width: 90%; min-width: 260px; opacity: 0; transition: all 0.4s; }
.neo-notif.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.neo-notif.success { border-color: #4caf50; }
.neo-notif.error { border-color: #f44336; }
</style>
</head>
<body>

<header>
    <h1>ADMIN PANEL</h1>
    <button class="header-btn" onclick="refreshAll()">Refresh</button>
</header>

<div class="tabs" id="mainTabs">

</div>

<div class="user-detail-page" id="userDetailPage">
    <div class="detail-page-header">
        <button class="back-btn" onclick="closeUserDetail()">←</button>
        <div><h2>Edit User</h2><p id="detailSubtitle">Kelola data user</p></div>
    </div>
    <div class="detail-avatar-big" id="detailAvatar">U</div>
    <div class="stats-grid">
        <div class="stat-box"><div class="label">Saldo</div><div class="value green" id="statSaldo">Rp 0</div></div>
        <div class="stat-box"><div class="label">Level</div><div class="value gold" id="statLevel">Bronze</div></div>
        <div class="stat-box"><div class="label">Total Deposit</div><div class="value gold" id="statDeposit">Rp 0</div></div>
        <div class="stat-box"><div class="label">Max Win</div><div class="value green" id="statMaxWin">Rp 0</div></div>
    </div>
    <div class="section-title">Data Akun</div>
    <div class="form-group"><label>Username</label><input type="text" id="editUsername" disabled></div>
    <div class="form-group"><label>Password</label><input type="text" id="editPassword"></div>
    <div class="form-group"><label>Email</label><input type="email" id="editEmail"></div>
    <div class="form-group"><label>No HP</label><input type="text" id="editNoHp"></div>
    <div class="form-group"><label>Kode Referral</label><input type="text" id="editKodeRef"></div>
    <div class="section-title">Data Bank</div>
    <div class="form-group"><label>Bank</label>
        <select id="editBank">
            <option value="">- Pilih Bank -</option>
            <option>BCA</option><option>BNI</option><option>BRI</option><option>MANDIRI</option>
            <option>DANA</option><option>OVO</option><option>GOPAY</option><option>SHOPEEPAY</option>
        </select>
    </div>
    <div class="form-group"><label>Nama Rekening</label><input type="text" id="editUsernameBank"></div>
    <div class="form-group"><label>Nomor Rekening</label><input type="text" id="editNoRekening"></div>
    <div class="section-title">Data Keuangan</div>
    <div class="form-group"><label>Saldo (Rp)</label><input type="number" id="editSaldo"></div>
    <div class="form-group"><label>Total Deposit (Rp)</label><input type="number" id="editTotalDeposit"></div>
    <div class="form-group"><label>Max Win (Rp)</label><input type="number" id="editMaxWin"></div>
    <div class="form-group"><label>Total Withdraw (Rp)</label><input type="number" id="editTotalWithdraw"></div>
    <div class="section-title">Status & Level</div>
    <div class="form-group"><label>Level</label>
        <select id="editLevel"><option>Bronze</option><option>Silver</option><option>Gold</option><option>Platinum</option><option>Diamond</option></select>
    </div>
    <div class="form-group"><label>Status</label>
        <select id="editStatus"><option>Aktif</option><option>Suspend</option><option>Banned</option></select>
    </div>
    <button class="save-btn" onclick="saveUser()">SIMPAN PERUBAHAN</button>
    <button class="danger-btn" onclick="deleteUser()">HAPUS USER</button>
</div>

<div class="content" id="mainContent">
    <div class="tab-content active" id="content-users">
        <div class="search-box">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchUser" placeholder="Cari username..." oninput="filterUsers()">
        </div>
        <div class="user-list" id="userList"></div>
    </div>
    <div class="tab-content" id="content-inbox">
        <div class="sub-tabs">
            <div class="sub-tab active" id="subTabDeposit" onclick="switchSubTab('deposit')">INBOX DEPOSIT <span class="badge" id="depositBadge">0</span></div>
            <div class="sub-tab" id="subTabWithdraw" onclick="switchSubTab('withdraw')">INBOX WITHDRAW <span class="badge" id="withdrawBadge">0</span></div>
        </div>
        <div id="depositInboxContainer" style="margin-top:15px;"></div>
        <div id="withdrawInboxContainer" style="margin-top:15px;display:none;"></div>
    </div>
    <div class="tab-content" id="content-chat">
        <div class="chat-list" id="chatList"></div>
    </div>
</div>

<div class="fs-overlay" id="fsOverlay" onclick="closeFullscreen()">
    <img id="fsImage" src="" alt="Fullscreen">
</div>

<div class="chat-window" id="chatWindow">
    <div class="chat-window-header">
        <button class="chat-back-btn" onclick="closeChatWindow()">←</button>
        <div style="flex:1;">
            <h3 id="chatWindowUsername" style="font-size:15px;color:#fff;">User</h3>
            <p style="font-size:11px;color:#4caf50;">Online</p>
        </div>
    </div>
    <div class="chat-window-messages" id="chatWindowMessages"></div>
    <div class="chat-window-input">
        <input type="text" id="chatWindowInput" placeholder="Balas pesan..." onkeypress="if(event.key==='Enter') sendAdminChat()">
        <button onclick="sendAdminChat()">Kirim</button>
    </div>
</div>

<div class="loading-overlay" id="loading">
    <div class="loading-spinner"></div>
    <div style="color:#d4af37;font-weight:bold;">Memuat...</div>
</div>

<script>
// ============================================================
// ⚠️ GANTI KEY DI BAWAH DENGAN ANON KEY ANDA (SAMA SEPERTI DI neo189.html)
// ============================================================
var SUPABASE_URL = 'https://cvgpgysveeeisawydjza.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2Z3BneXN2ZWVlaXNhd3lkanphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5Njc1MTcsImV4cCI6MjEwNzU0MzUxN30.PG7CXEyhtXYmfQj5KDbwKuRHObBz5tGsV5KRoM9v_iU';
// ============================================================

var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var allUsers = [];
var allPending = [];
var currentChatUser = null;
var currentEditingUser = null;
var chatWindowInterval = null;

function showNotif(message, type) {
    type = type || 'info';
    var existing = document.getElementById('neoNotif');
    if (existing) existing.remove();
    var notif = document.createElement('div');
    notif.id = 'neoNotif';
    notif.className = 'neo-notif ' + type;
    notif.innerHTML = '<span>' + message + '</span>';
    document.body.appendChild(notif);
    setTimeout(function() { notif.classList.add('show'); }, 50);
    setTimeout(function() { notif.classList.remove('show'); setTimeout(function() { notif.remove(); }, 400); }, 3000);
}

function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('content-' + tab).classList.add('active');
    document.getElementById('mainContent').style.display = 'block';
    document.getElementById('mainTabs').style.display = 'flex';
    document.getElementById('userDetailPage').classList.remove('active');
    if (tab === 'users') loadUsers();
    if (tab === 'inbox') loadPending();
    if (tab === 'chat') loadChatList();
}

function switchSubTab(type) {
    var depTab = document.getElementById('subTabDeposit');
    var wdTab = document.getElementById('subTabWithdraw');
    var depCont = document.getElementById('depositInboxContainer');
    var wdCont = document.getElementById('withdrawInboxContainer');
    if (type === 'deposit') {
        depTab.classList.add('active'); wdTab.classList.remove('active');
        depCont.style.display = 'block'; wdCont.style.display = 'none';
    } else {
        wdTab.classList.add('active'); depTab.classList.remove('active');
        wdCont.style.display = 'block'; depCont.style.display = 'none';
    }
}

function formatRupiah(angka) {
    return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
}

function refreshAll() {
    loadUsers();
    loadPending();
    loadChatList();
    showNotif('Data di-refresh', 'success');
}

function openFullscreen(src) {
    document.getElementById('fsImage').src = src;
    document.getElementById('fsOverlay').classList.add('active');
}
function closeFullscreen() {
    document.getElementById('fsOverlay').classList.remove('active');
}

async function loadUsers() {
    document.getElementById('loading').style.display = 'flex';
    try {
        var res = await supabase.from('users').select('*').order('id', { ascending: true });
        document.getElementById('loading').style.display = 'none';
        if (res.error) throw res.error;
        allUsers = res.data || [];
        renderUsers(allUsers);
    } catch (e) {
        document.getElementById('loading').style.display = 'none';
        showNotif('Gagal memuat user: ' + e.message, 'error');
    }
}

function renderUsers(users) {
    var container = document.getElementById('userList');
    if (users.length === 0) {
        container.innerHTML = '<div class="empty-inbox"><p>Tidak ada user</p></div>';
        return;
    }
    container.innerHTML = '';
    users.forEach(function(u) {
        container.innerHTML += '<div class="user-card" onclick="openUserDetail(\'' + u.username + '\')">' +
            '<div class="user-card-header">' +
            '<div class="user-card-name">' +
            '<div class="user-card-avatar">' + u.username.charAt(0).toUpperCase() + '</div>' +
            '<div><h3>' + u.username + '</h3><p>' + (u.bank || 'Bank belum diisi') + ' - ' + (u.no_rekening || '-') + '</p></div>' +
            '</div>' +
            '<div class="user-card-rank">' + (u.level || 'Bronze') + '</div>' +
            '</div>' +
            '<div style="display:flex;justify-content:space-between;align-items:center;">' +
            '<span class="user-card-detail">' + (u.email || '-') + ' | ' + (u.no_hp || '-') + '</span>' +
            '<span class="user-card-saldo">' + formatRupiah(u.saldo || 0) + '</span>' +
            '</div></div>';
    });
}

function filterUsers() {
    var q = document.getElementById('searchUser').value.toLowerCase();
    var filtered = allUsers.filter(function(u) { return u.username.toLowerCase().indexOf(q) !== -1; });
    renderUsers(filtered);
}

function openUserDetail(username) {
    var user = allUsers.find(function(u) { return u.username === username; });
    if (!user) return;
    currentEditingUser = user;

    document.getElementById('mainTabs').style.display = 'none';
    document.getElementById('mainContent').style.display = 'none';
    document.getElementById('userDetailPage').classList.add('active');

    document.getElementById('detailAvatar').innerText = user.username.charAt(0).toUpperCase();
    document.getElementById('detailSubtitle').innerText = '@' + user.username;
    document.getElementById('statSaldo').innerText = formatRupiah(user.saldo || 0);
    document.getElementById('statLevel').innerText = user.level || 'Bronze';
    document.getElementById('statDeposit').innerText = formatRupiah(user.total_deposit || 0);
    document.getElementById('statMaxWin').innerText = formatRupiah(user.max_win || 0);

    document.getElementById('editUsername').value = user.username || '';
    document.getElementById('editPassword').value = user.password || '';
    document.getElementById('editEmail').value = user.email || '';
    document.getElementById('editNoHp').value = user.no_hp || '';
    document.getElementById('editKodeRef').value = user.kode_ref || '';
    document.getElementById('editBank').value = user.bank || '';
    document.getElementById('editUsernameBank').value = user.username_bank || '';
    document.getElementById('editNoRekening').value = user.no_rekening || '';
    document.getElementById('editSaldo').value = user.saldo || 0;
    document.getElementById('editTotalDeposit').value = user.total_deposit || 0;
    document.getElementById('editMaxWin').value = user.max_win || 0;
    document.getElementById('editTotalWithdraw').value = user.total_withdraw || 0;
    document.getElementById('editLevel').value = user.level || 'Bronze';
    document.getElementById('editStatus').value = user.status || 'Aktif';

    window.scrollTo(0, 0);
}

function closeUserDetail() {
    document.getElementById('userDetailPage').classList.remove('active');
    document.getElementById('mainTabs').style.display = 'flex';
    document.getElementById('mainContent').style.display = 'block';
    currentEditingUser = null;
    loadUsers();
}

async function saveUser() {
    if (!currentEditingUser) return;

    var updatedData = {
        password: document.getElementById('editPassword').value,
        email: document.getElementById('editEmail').value,
        no_hp: document.getElementById('editNoHp').value,
        kode_ref: document.getElementById('editKodeRef').value,
        bank: document.getElementById('editBank').value,
        username_bank: document.getElementById('editUsernameBank').value,
        no_rekening: document.getElementById('editNoRekening').value,
        saldo: parseInt(document.getElementById('editSaldo').value) || 0,
        total_deposit: parseInt(document.getElementById('editTotalDeposit').value) || 0,
        max_win: parseInt(document.getElementById('editMaxWin').value) || 0,
        total_withdraw: parseInt(document.getElementById('editTotalWithdraw').value) || 0,
        level: document.getElementById('editLevel').value,
        status: document.getElementById('editStatus').value
    };

    document.getElementById('loading').style.display = 'flex';

    try {
        var res = await supabase.from('users').update(updatedData).eq('username', currentEditingUser.username);
        document.getElementById('loading').style.display = 'none';
        if (res.error) throw res.error;
        showNotif('Data user berhasil disimpan!', 'success');
        for (var key in updatedData) currentEditingUser[key] = updatedData[key];
    } catch (e) {
        document.getElementById('loading').style.display = 'none';
        showNotif('Gagal menyimpan: ' + e.message, 'error');
    }
}

async function deleteUser() {
    if (!currentEditingUser) return;
    if (!confirm('Yakin hapus user ' + currentEditingUser.username + '?')) return;

    document.getElementById('loading').style.display = 'flex';
    try {
        var res = await supabase.from('users').delete().eq('username', currentEditingUser.username);
        document.getElementById('loading').style.display = 'none';
        if (res.error) throw res.error;
        showNotif('User berhasil dihapus', 'success');
        closeUserDetail();
    } catch (e) {
        document.getElementById('loading').style.display = 'none';
        showNotif('Gagal hapus: ' + e.message, 'error');
    }
}

async function loadPending() {
    try {
        var res = await supabase.from('pending').select('*').order('tanggal', { ascending: false });
        if (res.error) throw res.error;
        allPending = res.data || [];
        var deposits = allPending.filter(function(p) { return p.type === 'deposit'; });
        var withdraws = allPending.filter(function(p) { return p.type === 'withdraw'; });

        document.getElementById('inboxBadge').innerText = allPending.length;
        document.getElementById('depositBadge').innerText = deposits.length;
        document.getElementById('withdrawBadge').innerText = withdraws.length;

        renderDepositInbox(deposits);
        renderWithdrawInbox(withdraws);
    } catch (e) {}
}

function renderDepositInbox(deposits) {
    var container = document.getElementById('depositInboxContainer');
    if (deposits.length === 0) {
        container.innerHTML = '<div class="empty-inbox"><p>Tidak ada permohonan deposit</p></div>';
        return;
    }
    container.innerHTML = '';
    deposits.forEach(function(p) {
        container.innerHTML += '<div class="deposit-user-card" onclick="openDepositDetail(' + p.id + ')">' +
            '<div class="deposit-user-info">' +
            '<div class="deposit-user-avatar">' + p.username.charAt(0).toUpperCase() + '</div>' +
            '<div><h3>' + p.username + '</h3><p>Klik untuk lihat bukti</p></div>' +
            '</div>' +
            '<div class="deposit-user-nominal">' +
            '<div class="nom">' + formatRupiah(p.nominal) + '</div>' +
            '<div class="time">' + new Date(p.tanggal).toLocaleString('id-ID') + '</div>' +
            '</div></div>';
    });
}

function openDepositDetail(pendingId) {
    var p = allPending.find(function(x) { return x.id === pendingId; });
    if (!p) return;

    document.getElementById('mainTabs').style.display = 'none';
    document.getElementById('mainContent').style.display = 'none';
    document.getElementById('userDetailPage').classList.add('active');

    document.getElementById('detailAvatar').innerText = p.username.charAt(0).toUpperCase();
    document.getElementById('detailSubtitle').innerText = 'Permohonan Deposit';
    document.getElementById('statSaldo').innerText = formatRupiah(p.nominal);
    document.getElementById('statLevel').innerText = 'DEPOSIT';
    document.getElementById('statDeposit').innerText = new Date(p.tanggal).toLocaleString('id-ID');
    document.getElementById('statMaxWin').innerText = p.username;

    var buktiUrl = p.bukti_url || '';
    var html = '<div class="section-title">Bukti Transfer</div>' +
        '<img src="' + buktiUrl + '" class="bukti-thumb" style="max-width:100%;" onclick="openFullscreen(\'' + buktiUrl + '\')" onerror="this.style.display=\'none\'">' +
        '<div class="section-title">Detail</div>' +
        '<div class="withdraw-detail">' +
        '<div class="withdraw-row"><span class="label">USERNAME</span><span class="value">' + p.username + '</span></div>' +
        '<div class="withdraw-row"><span class="label">NOMINAL</span><span class="value" style="color:#4caf50;">' + formatRupiah(p.nominal) + '</span></div>' +
        '</div>' +
        '<div class="inbox-actions">' +
        '<button class="inbox-btn setujui" onclick="approveDeposit(' + p.id + ');">SETUJUI</button>' +
        '<button class="inbox-btn tolak" onclick="rejectPending(' + p.id + ');">TOLAK</button>' +
        '</div>';

    var editContainer = document.getElementById('editUsername').parentElement.parentElement;
    editContainer.innerHTML = html;
    window.scrollTo(0, 0);
}

function renderWithdrawInbox(withdraws) {
    var container = document.getElementById('withdrawInboxContainer');
    if (withdraws.length === 0) {
        container.innerHTML = '<div class="empty-inbox"><p>Tidak ada permohonan withdraw</p></div>';
        return;
    }
    container.innerHTML = '';
    withdraws.forEach(function(p) {
        container.innerHTML += '<div class="inbox-item withdraw">' +
            '<div class="inbox-header">' +
            '<span class="inbox-user">' + p.username + '</span>' +
            '<span class="inbox-type withdraw">WITHDRAW</span>' +
            '</div>' +
            '<div class="withdraw-detail">' +
            '<div class="withdraw-row"><span class="label">TOTAL WITHDRAW</span><span class="value" style="color:#ff9800;">' + formatRupiah(p.nominal) + '</span></div>' +
            '<div class="withdraw-row"><span class="label">NAMA REK</span><span class="value">' + (p.username_bank || '-') + '</span></div>' +
            '<div class="withdraw-row"><span class="label">NO REK</span><span class="value">' + (p.no_rekening || '-') + '</span></div>' +
            '<div class="withdraw-row"><span class="label">BANK</span><span class="value">' + (p.bank || '-') + '</span></div>' +
            '</div>' +
            '<div class="withdraw-warning">SILAHKAN TF SESUAI DATA YANG BERLAKU, JIKA NAMA REK DENGAN DATA BERBEDA MAKA AKAN HANGUS!</div>' +
            '<div class="inbox-actions">' +
            '<button class="inbox-btn setujui" onclick="approveWithdraw(' + p.id + ')">SETUJUI</button>' +
            '<button class="inbox-btn tolak" onclick="rejectPending(' + p.id + ')">TOLAK</button>' +
            '</div></div>';
    });
}

async function approveDeposit(pendingId) {
    var p = allPending.find(function(x) { return x.id === pendingId; });
    if (!p) return;

    document.getElementById('loading').style.display = 'flex';
    try {
        var res = await supabase.rpc('approve_deposit', {
            p_username: p.username,
            p_nominal: p.nominal,
            p_pending_id: p.id
        });
        if (res.error) throw res.error;
        document.getElementById('loading').style.display = 'none';
        showNotif('Deposit disetujui!', 'success');
        loadPending();
        loadUsers();
    } catch (e) {
        document.getElementById('loading').style.display = 'none';
        showNotif('Gagal: ' + e.message, 'error');
    }
}

async function approveWithdraw(pendingId) {
    var p = allPending.find(function(x) { return x.id === pendingId; });
    if (!p) return;

    document.getElementById('loading').style.display = 'flex';
    try {
        var res = await supabase.rpc('approve_withdraw', {
            p_username: p.username,
            p_nominal: p.nominal,
            p_pending_id: p.id
        });
        if (res.error) throw res.error;
        document.getElementById('loading').style.display = 'none';
        showNotif('Withdraw disetujui!', 'success');
        loadPending();
        loadUsers();
    } catch (e) {
        document.getElementById('loading').style.display = 'none';
        showNotif('Gagal: ' + e.message, 'error');
    }
}

async function rejectPending(pendingId) {
    var p = allPending.find(function(x) { return x.id === pendingId; });
    if (!p) return;

    document.getElementById('loading').style.display = 'flex';
    try {
        await supabase.from('transactions').insert({
            username: p.username, type: p.type,
            pesan: (p.type === 'deposit' ? 'Deposit' : 'Withdraw') + ' Ditolak',
            nominal: p.nominal
        });
        var res = await supabase.from('pending').delete().eq('id', p.id);
        if (res.error) throw res.error;
        document.getElementById('loading').style.display = 'none';
        showNotif('Permohonan ditolak', 'info');
        loadPending();
        loadUsers();
    } catch (e) {
        document.getElementById('loading').style.display = 'none';
        showNotif('Gagal: ' + e.message, 'error');
    }
}

async function loadChatList() {
    try {
        var res = await supabase.from('chats').select('*').order('tanggal', { ascending: false });
        if (res.error) throw res.error;

        var users = {};
        (res.data || []).forEach(function(c) {
            var u = c.username;
            if (!users[u]) users[u] = { username: u, last_message: '', last_time: '', unread: 0 };
            if (!users[u].last_message) users[u].last_message = c.message;
            if (!users[u].last_time) users[u].last_time = c.tanggal;
            if (c.from_user === 'user' && !c.read_status) users[u].unread++;
        });

        var chatList = Object.values(users);
        var totalUnread = chatList.reduce(function(sum, c) { return sum + c.unread; }, 0);
        document.getElementById('chatBadge').innerText = totalUnread;
        renderChatList(chatList);
    } catch (e) {}
}

function renderChatList(list) {
    var container = document.getElementById('chatList');
    if (list.length === 0) {
        container.innerHTML = '<div class="empty-inbox"><p>Belum ada chat</p></div>';
        return;
    }
    container.innerHTML = '';
    list.forEach(function(c) {
        container.innerHTML += '<div class="chat-user-item" onclick="openChatWindow(\'' + c.username + '\')">' +
            '<div class="chat-user-avatar">' + c.username.charAt(0).toUpperCase() + '</div>' +
            '<div class="chat-user-info"><h3>' + c.username + '</h3><p>' + c.last_message + '</p></div>' +
            (c.unread > 0 ? '<div class="chat-user-unread">' + c.unread + '</div>' : '') +
            '</div>';
    });
}

function openChatWindow(user) {
    currentChatUser = user;
    document.getElementById('chatWindowUsername').innerText = user;
    document.getElementById('chatWindow').classList.add('active');
    loadChatMessages();
    if (chatWindowInterval) clearInterval(chatWindowInterval);
    chatWindowInterval = setInterval(loadChatMessages, 3000);
    supabase.from('chats').update({ read_status: true }).eq('username', user).eq('from_user', 'user').then(function() { loadChatList(); });
}

function closeChatWindow() {
    document.getElementById('chatWindow').classList.remove('active');
    if (chatWindowInterval) { clearInterval(chatWindowInterval); chatWindowInterval = null; }
    currentChatUser = null;
    loadChatList();
}

async function loadChatMessages() {
    if (!currentChatUser) return;
    var res = await supabase.from('chats').select('*').eq('username', currentChatUser).order('tanggal', { ascending: true });

    var container = document.getElementById('chatWindowMessages');
    container.innerHTML = '';
    if (!res.data || res.data.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:#666;padding:20px;">Belum ada pesan</div>';
        return;
    }
    res.data.forEach(function(c) {
        var cls = c.from_user === 'user' ? 'user' : 'admin';
        container.innerHTML += '<div class="chat-msg ' + cls + '">' + escapeHtml(c.message) + '<span class="time">' + (c.time || '') + '</span></div>';
    });
    container.scrollTop = container.scrollHeight;
}

async function sendAdminChat() {
    var input = document.getElementById('chatWindowInput');
    var msg = input.value.trim();
    if (!msg || !currentChatUser) return;
    input.value = '';
    var now = new Date();
    var timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    await supabase.from('chats').insert({
        username: currentChatUser, from_user: 'admin', message: msg, time: timeStr, read_status: true
    });
    loadChatMessages();
}

function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

setInterval(function() {
    if (document.getElementById('content-inbox').classList.contains('active')) loadPending();
    if (document.getElementById('content-chat').classList.contains('active')) loadChatList();
}, 5000);

window.addEventListener('DOMContentLoaded', function() {
    loadUsers();
    loadPending();
    loadChatList();
});
</script>
